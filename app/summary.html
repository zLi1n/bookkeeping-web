<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeping - Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body onload="initPage('summary')" class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Bookkeeper</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="summary.html">Summary</a></li>
        <li class="nav-item"><a class="nav-link" href="analysis.html">Analysis</a></li>
        <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container px-4">
  <h2 class="mb-4">Financial Summary</h2>
  
  <div class="row g-4 mb-4 text-center">
    <div class="col-md-4">
      <div class="card shadow-sm h-100 py-2">
        <div class="card-body">
          <label class="text-muted small text-uppercase fw-bold">Total Income</label>
          <div id="totalIncome" class="fs-2 fw-bold text-success">0.00</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100 py-2">
        <div class="card-body">
          <label class="text-muted small text-uppercase fw-bold">Total Expense</label>
          <div id="totalExpense" class="fs-2 fw-bold text-danger">0.00</div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm h-100 py-2">
        <div class="card-body">
          <label class="text-muted small text-uppercase fw-bold">Balance</label>
          <div id="balance" class="fs-2 fw-bold text-dark">0.00</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('monthlySection')" style="cursor: pointer;">
      <h5 class="mb-0">Monthly Breakdown</h5>
      <span class="toggle-icon" id="monthlySection-icon">▼</span>
    </div>
    <div id="monthlySection" class="card-body p-0">
      <div class="table-responsive">
        <table id="monthlyTable" class="table table-hover mb-0"></table>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('yearlySection')" style="cursor: pointer;">
      <h5 class="mb-0">Yearly Breakdown</h5>
      <span class="toggle-icon" id="yearlySection-icon">▼</span>
    </div>
    <div id="yearlySection" class="card-body p-0">
      <div class="table-responsive">
        <table id="yearlyTable" class="table table-hover mb-0"></table>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto" id="toastTitle">Notification</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/summary.js"></script>
<script src="js/app.js"></script>

</body>
</html>
