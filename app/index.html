<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeping - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body onload="initPage('home')" class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Bookkeeper</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="summary.html">Summary</a></li>
        <li class="nav-item"><a class="nav-link" href="analysis.html">Analysis</a></li>
        <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container px-4">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('addTransactionSection')" style="cursor: pointer;">
      <h5 class="mb-0" id="addPageTitle">Add Transaction</h5>
      <span class="toggle-icon open" id="addTransactionSection-icon">▼</span>
    </div>
    <div id="addTransactionSection" class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input type="date" id="date" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select id="category" class="form-select">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Salary">Salary</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <input id="description" class="form-control" placeholder="e.g. Grocery Shopping">
        </div>
        <div class="col-md-6">
          <label class="form-label">Amount</label>
          <input type="number" id="amount" class="form-control" placeholder="0.00">
        </div>
        <div class="col-md-6">
          <label class="form-label">Type</label>
          <select id="type" class="form-select">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="col-12 d-flex gap-2 mt-4">
          <button class="btn btn-success flex-grow-1" id="addBtn" onclick="addTransaction()">Add Transaction</button>
          <button class="btn btn-danger" id="cancelBtn" onclick="cancelEdit()" style="display: none;">Cancel</button>
        </div>
      </div>
      
      <hr class="my-4">
      
      <div class="row g-2">
        <div class="col-sm-6">
          <button class="btn btn-outline-primary w-100" onclick="exportCSV()">Export CSV</button>
        </div>
        <div class="col-sm-6">
          <label for="csvFile" class="btn btn-outline-secondary w-100">Import CSV</label>
          <input type="file" id="csvFile" onchange="importCSV(event)" style="display: none;">
        </div>
      </div>
    </div>
  </div>

  <div id="homeSummary" class="row g-3 mb-2">
    <!-- Will be populated by JS -->
  </div>

  <div id="homeHistory" class="table-responsive"></div>
</div>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto" id="toastTitle">Notification</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this transaction? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/csv.js"></script>
<script src="js/app.js"></script>

</body>
</html>
