<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeping - Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body onload="initPage('analysis')" class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Bookkeeper</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="summary.html">Summary</a></li>
        <li class="nav-item"><a class="nav-link active" href="analysis.html">Analysis</a></li>
        <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container px-4">
  <h2 class="mb-4">Financial Analysis</h2>
  
  <!-- 1. Income vs Expense Trends (Line) -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('trendSection')" style="cursor: pointer;">
      <h5 class="mb-0">Income vs Expense Trends (Line)</h5>
      <span class="toggle-icon open" id="trendSection-icon">▼</span>
    </div>
    <div id="trendSection" class="card-body" style="display: block;">
      <div class="btn-group w-100 mb-4 shadow-sm">
        <button class="btn btn-outline-primary btn-sm active chart-btn" onclick="updateTrendView('daily', this)">Daily</button>
        <button class="btn btn-outline-primary btn-sm chart-btn" onclick="updateTrendView('monthly', this)">Monthly</button>
        <button class="btn btn-outline-primary btn-sm chart-btn" onclick="updateTrendView('yearly', this)">Yearly</button>
        <button class="btn btn-outline-primary btn-sm chart-btn" onclick="updateTrendView('all', this)">All</button>
      </div>
      <div class="chart-container" style="position: relative; height:400px; width:100%">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 2. Category Comparison (Bar) -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('barSection')" style="cursor: pointer;">
      <h5 class="mb-0">Category Comparison (Bar)</h5>
      <span class="toggle-icon open" id="barSection-icon">▼</span>
    </div>
    <div id="barSection" class="card-body" style="display: block;">
      <div class="btn-group w-100 mb-4 shadow-sm">
        <button class="btn btn-outline-primary btn-sm active chart-btn category-filter-btn" data-view="all" onclick="updateCategoryView('all', this)">All Time</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="yearly" onclick="updateCategoryView('yearly', this)">This Year</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="monthly" onclick="updateCategoryView('monthly', this)">This Month</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="daily" onclick="updateCategoryView('daily', this)">Today</button>
      </div>
      <div class="chart-container" style="position: relative; height:400px; width:100%">
        <canvas id="categoryBarChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 3. Category Distribution (Pie) -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center" onclick="toggleSection('pieSection')" style="cursor: pointer;">
      <h5 class="mb-0">Category Distribution (Pie)</h5>
      <span class="toggle-icon open" id="pieSection-icon">▼</span>
    </div>
    <div id="pieSection" class="card-body" style="display: block;">
      <div class="btn-group w-100 mb-4 shadow-sm">
        <button class="btn btn-outline-primary btn-sm active chart-btn category-filter-btn" data-view="all" onclick="updateCategoryView('all', this)">All Time</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="yearly" onclick="updateCategoryView('yearly', this)">This Year</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="monthly" onclick="updateCategoryView('monthly', this)">This Month</button>
        <button class="btn btn-outline-primary btn-sm chart-btn category-filter-btn" data-view="daily" onclick="updateCategoryView('daily', this)">Today</button>
      </div>
      <div class="chart-container" style="position: relative; height:400px; width:100%">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto" id="toastTitle">Notification</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/storage.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>

</body>
</html>
